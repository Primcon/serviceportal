name: vactech-report-dispatch
location: East US
identity:
  type: SystemAssigned
properties:
  environmentId: /subscriptions/40e90bbd-cd22-4ede-8702-8b8027ced023/resourceGroups/vactech-service-portal-rg/providers/Microsoft.App/managedEnvironments/vactech-service-env
  configuration:
    triggerType: Schedule
    scheduleTriggerConfig:
      cronExpression: "*/5 * * * *"
      parallelism: 1
      replicaCompletionCount: 1
    replicaTimeout: 300
    replicaRetryLimit: 1
    secrets:
      - name: report-worker-secret
        keyVaultUrl: https://vactech-service-kv.vault.azure.net/secrets/report-worker-secret
        identity: system
  template:
    containers:
      - name: dispatch-reports
        image: curlimages/curl:8.17.0
        command:
          - sh
          - -c
          - >-
            curl --fail --silent --show-error --request POST "https://vactech-service-portal.ambitiouspebble-d8281bb3.eastus.azurecontainerapps.io/api/internal/reports/dispatch?limit=10" --header "x-report-worker-secret: $REPORT_WORKER_SECRET"
        env:
          - name: REPORT_WORKER_SECRET
            secretRef: report-worker-secret
        resources:
          cpu: 0.25
          memory: 0.5Gi