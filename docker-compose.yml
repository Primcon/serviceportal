services:
  database:
    image: postgres:16-alpine
    container_name: vactech-service-portal-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vactech_service_portal}
      POSTGRES_USER: ${POSTGRES_USER:-vactech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vactech-dev-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: